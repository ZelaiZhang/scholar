name: Research OS checks

on:
  push:
    branches: [main, mac]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile sources
        run: python -m compileall -q src scripts
      - name: Run regression tests
        run: python -m pytest -q -W error
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check repository and knowledge base
        run: |
          python -m research_os doctor
          python -m research_os kb doctor
      - name: Check patch whitespace
        run: git diff --check
      - name: Verify wheel user journey outside source tree
        run: python scripts/verify_wheel.py
