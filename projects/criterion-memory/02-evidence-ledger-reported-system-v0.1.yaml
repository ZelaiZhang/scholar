    limitations: "Deterministic arithmetic about candidate-tree metrics, not significance, severity weighting, population accuracy or clinical outcomes."
  - claim_id: A02
    statement: "Reported review counts imply a net increase of seven correct judgments (+5.30 percentage points), comprising one positive and six negative; balanced accuracy rises by 4.55 points. Before review Ours has higher balanced accuracy but one fewer overall correct judgment than ICL."
    type: inference
