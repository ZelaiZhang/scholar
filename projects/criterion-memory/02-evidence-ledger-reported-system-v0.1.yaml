    statement: "With the reported 33 positive and 99 negative candidate-tree judgments, one correct positive decision changes its rate by 3.03 percentage points and balanced accuracy by 1.515 points; one correct negative changes its rate by 1.01 points and balanced accuracy by 0.505 points."
    type: inference
    status: verified
    confidence: high
    support:
