project: criterion-memory
schema_version: 1
verification_scope: reported_material_content_only
experiment_code_and_configuration_audit: unverified
clinical_effectiveness: not_established
claims:
  - claim_id: R01
    statement: "The supplied architecture figure describes standardizing DSM-5 criteria, SCID-5 questions and coding rules into diagnostic trees, and running all trees in the same symptom category in the current experiment."
    type: fact
    status: verified
    confidence: high
    support:
      - source_id: src-5068d2127c40e9f4
        locator: "M2; source figure Image #3, panels a and b"
    opposition: []
    limitations: "Verified as the figure's reported design only. Scanned source edition, tree content, coding implementation and licenses were not inspected."
  - claim_id: R02
    statement: "Panel c describes criterion decomposition, relevant Q&A retrieval, same-turn question/response quotations, observed facts, support/refute/insufficient evidence, validation and adaptive probing when the criterion remains undecidable."
    type: fact
    status: verified
    confidence: high
    support:
      - source_id: src-5068d2127c40e9f4
        locator: "M3; source figure Image #3, panel c"
    opposition: []
    limitations: "Diagram content only. This does not independently establish faithful retrieval, semantic correctness or a quantified component benefit."
  - claim_id: R03
    statement: "Panel c reports separate criterion-state and symptom-note updates, while retaining the full dialogue history as the primary evidence source."
    type: fact
    status: verified
    confidence: high
    support:
      - source_id: src-5068d2127c40e9f4
        locator: "M3, Dual-Memory Update; source figure Image #3, panel c"
    opposition: []
    limitations: "Reported design, not an implementation audit. No budget-constrained compression or learned memory policy is established."
  - claim_id: R04
    statement: "The figure marks within-tree branching, count/threshold evaluation and branch backtracking as implemented; candidate screening and cross-tree DSM/ICD verification are marked planned."
    type: fact
    status: verified
    confidence: high
    support:
      - source_id: src-5068d2127c40e9f4
        locator: "M2 and M4; source figure Image #3, panels b, d and e and legend"
    opposition: []
    limitations: "Reported figure status only. Backtracking need not mean correction of old evidence; the later final reviewer cannot automatically be equated with panel e."
  - claim_id: R05
    statement: "The researcher reports organizing dialogue with turn IDs, node judgments and criterion states in JSON to address interference from duplicate-question suppression with node judgment."
    type: fact
    status: verified
    confidence: high
    support:
      - source_id: src-5068d2127c40e9f4
        locator: "M1, researcher conversation transcription"
    opposition: []
    limitations: "Verified as a researcher-reported observation only; no controlled JSON or deduplication ablation was supplied."
  - claim_id: R06
    statement: "The researcher confirms that the Qwen Ours 110/132 and 117/132 versions differ only by added review with the other settings unchanged, and describes review as a final independent rejudgment of tree outputs."
    type: fact
    status: verified
    confidence: high
    support:
      - source_id: src-5068d2127c40e9f4
        locator: "M5, two quoted researcher replies"
    opposition: []
    limitations: "Verification concerns the replies, not equality of runtime configurations. Review input, prompt, model, randomness, anchoring and label access remain unaudited."
  - claim_id: R07
    statement: "The supplied pre-review Qwen3.5-35B-A3B table reports Direct 103/132 (28/33, 75/99), CoT 108/132 (30/33, 78/99), ICL 111/132 (29/33, 82/99), and Ours 110/132 (31/33, 79/99), where parentheses denote correct-tree and wrong-tree counts."
    type: fact
