claims:
- claim_id: F01
  statement: Columbia describes SCID-5 as a semi-structured DSM-5 interview administered
    by a clinician or trained mental health professional.
  type: fact
  status: verified
  confidence: high
  support:
  - source_id: src-7199934b02d27442
    locator: 'FAQ: What is the SCID-5?, opening paragraph'
  opposition: []
  limitations: Official public overview only; the researcher's scanned book and its
    edition have not been inspected.
- claim_id: F02
  statement: PsyCoTalk describes transforming SCID-5-RV into a hierarchical diagnostic
    state machine and a diagnostic context tree.
  type: fact
  status: verified
  confidence: high
  support:
  - source_id: src-19423ffa02550e36
    locator: 'arXiv v2, Section 4.1: Clinical-Grounded Interview Pipeline, opening
      paragraphs'
  opposition: []
  limitations: Selected full-text sections inspected; this verifies a reported design,
    not independent clinical efficacy.
- claim_id: F03
  statement: PsyCoTalk uses binary symptom threshold states and describes a patient
    simulator that answers no for symptoms absent from its EMR or incompatible with
    its provisional diagnosis.
  type: fact
  status: verified
  confidence: high
  support:
  - source_id: src-19423ffa02550e36
    locator: 'arXiv v2, Section 4.1: Binary symptom scale and flow control; Section
      4.2: Patient Agent'
  opposition: []
  limitations: This is a simulation rule in that paper; it does not establish that
    undocumented evidence is negative in a clinical record.
