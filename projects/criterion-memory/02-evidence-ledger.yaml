- claim_id: H01
  statement: At a matched context budget, criterion-preserving revisable memory may
    reduce critical evidence loss while improving diagnosis quality over strong general-memory
    baselines.
  type: hypothesis
  status: unverified
  confidence: low
  support: []
  opposition: []
  limitations: Unimplemented hypothesis; no experimental result, dataset license clearance,
    or clinician validation exists in this workspace.
- claim_id: H02
  statement: A learned memory policy may improve the quality-cost tradeoff beyond
    a deterministic criterion-preserving policy.
  type: hypothesis
  status: unverified
  confidence: low
  support: []
  opposition: []
  limitations: RL is optional and must justify its added training and inference costs;
    no training is authorized in this repository.
