[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-os"
version = "0.6.0"
description = "Evidence-first research guidance workspace for Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
research-os = "research_os.cli:entrypoint"

[tool.setuptools]
packages = ["research_os", "research_os.templates"]

[tool.setuptools.package-dir]
research_os = "src/research_os"
"research_os.templates" = "src/research_os/templates"

[tool.setuptools.package-data]
"research_os.templates" = ["*.md", "*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
